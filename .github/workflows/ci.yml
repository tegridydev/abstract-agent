name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
          enable-cache: true
      - run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - run: uv run --locked --python ${{ matrix.python-version }} ruff check .
      - run: uv run --locked --python ${{ matrix.python-version }} ruff format --check .
      - run: >-
          uv run --locked --python ${{ matrix.python-version }} pytest
          --cov=agent --cov-branch --cov-report=term-missing
      - run: uv build --out-dir "${RUNNER_TEMP}/dist"
      - name: Verify release artifacts are public-safe
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "dist"
          artifacts = sorted(
              [*artifact_dir.glob("*.whl"), *artifact_dir.glob("*.tar.gz")]
          )
          assert artifacts, "uv build produced no release artifacts"

          forbidden_roots = {
              ".cache",
              ".hypothesis",
              ".mypy_cache",
              ".nox",
              ".pytest_cache",
              ".ruff_cache",
              ".tox",
              ".venv",
              "build",
              "dist",
              "htmlcov",
              "knowledge",
          }
          forbidden_root_files = {
              ".abstract-agent.toml",
              ".coverage",
              ".env",
              "coverage.xml",
          }

          def project_parts(name: str) -> tuple[str, ...]:
              parts = PurePosixPath(name).parts
              if parts and parts[0].startswith("abstract_agent-"):
                  parts = parts[1:]
              return parts

          def is_forbidden(name: str) -> bool:
              parts = project_parts(name)
              if not parts:
                  return False
              root = parts[0]
              if root in forbidden_roots or root in forbidden_root_files:
                  return True
              if root.startswith((".abstract-agent.toml.", ".coverage.", ".env.")):
                  return True
              if parts[:2] == ("agent", "output"):
                  return True
              return "__pycache__" in parts or any(
                  part.endswith((".pyc", ".pyd", ".pyo")) for part in parts
              )

          bad_members: list[str] = []
          for artifact in artifacts:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
              else:
                  with tarfile.open(artifact) as archive:
                      names = archive.getnames()
              bad_members.extend(name for name in names if is_forbidden(name))

          assert not bad_members, f"release artifacts contain local files: {bad_members}"
          PY

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
          enable-cache: true
      - run: uv sync --locked --all-groups --python 3.14
      - run: >-
          uv export --quiet --locked --all-groups --no-emit-project --format requirements.txt
          --output-file "${RUNNER_TEMP}/audit-requirements.txt"
      - run: >-
          uv run --locked pip-audit --strict --require-hashes
          --requirement "${RUNNER_TEMP}/audit-requirements.txt"
